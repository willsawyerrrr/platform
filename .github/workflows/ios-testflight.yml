name: iOS TestFlight

on:
  workflow_call:
    inputs:
      project-dir:
        description: Directory containing the XcodeGen `project.yml` or the `.xcodeproj`.
        type: string
        default: ios
      scheme:
        description: Scheme to archive.
        type: string
        required: true
      marketing-version:
        description: Marketing version the project must declare.
        type: string
        default: 0.1.0
      env:
        description: Newline-separated `KEY=value` pairs exported before generating the project.
        type: string
        default: ""
    secrets:
      OP_INTEGRATION_KEY:
        description: Service account integration key for the 1Password Environment that holds the secrets.
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app
      OP_WORKLOAD_ID: ${{ vars.OP_WORKLOAD_ID }}
      OP_ENVIRONMENT_ID: ${{ vars.OP_ENVIRONMENT_ID }}
      OP_INTEGRATION_KEY: ${{ secrets.OP_INTEGRATION_KEY }}
    defaults:
      run:
        working-directory: ${{ inputs.project-dir }}
    steps:
      - uses: actions/checkout@v7
      - uses: 1password/load-secrets-action@v5
        with:
          export-env: true
      - name: Export build environment
        env:
          BUILD_ENV: ${{ inputs.env }}
        run: '[[ -z "$BUILD_ENV" ]] || echo "$BUILD_ENV" >> "$GITHUB_ENV"'
      - name: Generate the Xcode project
        run: |
          if [[ -f project.yml ]]; then
            brew install xcodegen
            xcodegen generate
          fi
      - name: Check the marketing version
        env:
          SCHEME: ${{ inputs.scheme }}
          EXPECTED: ${{ inputs.marketing-version }}
        run: |
          projects=(*.xcodeproj)
          [[ ${#projects[@]} -eq 1 ]] || { echo "Expected exactly one .xcodeproj" >&2; exit 1; }
          actual=$(xcodebuild -showBuildSettings -project "${projects[0]}" -scheme "$SCHEME" -configuration Release |
            awk '$1 == "MARKETING_VERSION" { print $3; exit }')
          [[ "$actual" == "$EXPECTED" ]] || {
            echo "::error::MARKETING_VERSION is '$actual' but must be '$EXPECTED'" >&2
            exit 1
          }
      - name: Write the App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/key.p8"
      - name: Archive
        env:
          SCHEME: ${{ inputs.scheme }}
        run: |
          projects=(*.xcodeproj)
          settings=()
          [[ -z "${DEVELOPMENT_TEAM:-}" ]] || settings+=(DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM")
          [[ ${#projects[@]} -eq 1 ]] || { echo "Expected exactly one .xcodeproj" >&2; exit 1; }
          xcodebuild archive \
            -project "${projects[0]}" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            "${settings[@]}" \
            -quiet
      - name: Embed entitlements
        run: |
          projects=(*.xcodeproj)
          archive="$RUNNER_TEMP/app.xcarchive"
          settings="$(xcodebuild -showBuildSettings -project "${projects[0]}" -alltargets -configuration Release -json)"
          jq -c '.[].buildSettings | select(.CODE_SIGN_ENTITLEMENTS // "" != "")' <<< "$settings" | while read -r target; do
            id="$(jq -r .PRODUCT_BUNDLE_IDENTIFIER <<< "$target")"
            src="$(jq -r '.SRCROOT + "/" + .CODE_SIGN_ENTITLEMENTS' <<< "$target")"
            team="${DEVELOPMENT_TEAM:-$(jq -r '.DEVELOPMENT_TEAM // ""' <<< "$target")}"
            [[ -f "$src" ]] || continue
            expanded="$RUNNER_TEMP/$id.entitlements"
            sed -e "s/\$(PRODUCT_BUNDLE_IDENTIFIER)/$id/g" \
              -e "s/\$(AppIdentifierPrefix)/$team./g" -e "s/\$(TeamIdentifierPrefix)/$team./g" "$src" > "$expanded"
            find "$archive/Products/Applications" \( -name '*.app' -o -name '*.appex' \) -print0 |
              while IFS= read -r -d '' bundle; do
                if [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/Info.plist")" == "$id" ]]; then
                  codesign --force --sign - --entitlements "$expanded" "$bundle"
                fi
              done
          done
      - name: Upload to TestFlight
        env:
          SCHEME: ${{ inputs.scheme }}
        run: |
          team="${DEVELOPMENT_TEAM:-}"
          if [[ -z "$team" ]]; then
            projects=(*.xcodeproj)
            team=$(xcodebuild -showBuildSettings -project "${projects[0]}" -scheme "$SCHEME" -configuration Release |
              awk '$1 == "DEVELOPMENT_TEAM" { print $3; exit }')
          fi
          [[ -n "$team" ]] || { echo "No development team: set DEVELOPMENT_TEAM in the project or the env input" >&2; exit 1; }
          team_key="<key>teamID</key><string>$team</string>"
          cat > "$RUNNER_TEMP/export.plist" <<P
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            $team_key
          </dict>
          </plist>
          P
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/key.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Attach the build to its App Store version
        run: |
          app="$(echo "$RUNNER_TEMP"/app.xcarchive/Products/Applications/*.app)"
          plist="$app/Info.plist"
          read_key() { /usr/libexec/PlistBuddy -c "Print :$1" "$plist"; }
          curl -fsS https://raw.githubusercontent.com/willsawyerrrr/platform/main/scripts/attach-build -o "$RUNNER_TEMP/attach-build"
          node "$RUNNER_TEMP/attach-build" "$RUNNER_TEMP/asc/key.p8" \
            "$(read_key CFBundleIdentifier)" \
            "$(read_key CFBundleShortVersionString)" \
            "$(read_key CFBundleVersion)"
      - name: Remove the API key
        if: always()
        run: rm -r "$RUNNER_TEMP/asc"
