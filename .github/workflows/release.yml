name: Release

on:
  workflow_call:
    inputs:
      formula:
        description: Formula name in the tap; omit to skip publishing a formula. Mutually exclusive with `cask`.
        type: string
        default: ""
      cask:
        description: Cask token in the tap; omit to skip publishing a cask. Mutually exclusive with `formula`.
        type: string
        default: ""
      build-command:
        description: Shell command run on macOS at the repo root with `VERSION` set (the tag without `v`); must produce `asset`. Required with `cask`.
        type: string
        default: ""
      asset:
        description: Path of the zip that `build-command` produces, uploaded to the release under its basename. Required with `cask`.
        type: string
        default: ""
    secrets:
      OP_INTEGRATION_KEY:
        description: Service account integration key for the 1Password Environment that holds the secrets.
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check the Homebrew inputs
        env:
          FORMULA: ${{ inputs.formula }}
          CASK: ${{ inputs.cask }}
          BUILD_COMMAND: ${{ inputs.build-command }}
          ASSET: ${{ inputs.asset }}
        run: |
          if [[ -n "$FORMULA" && -n "$CASK" ]]; then
            echo "::error::Set only one of formula and cask"; exit 1
          fi
          if [[ -n "$CASK" && ( -z "$BUILD_COMMAND" || -z "$ASSET" ) ]]; then
            echo "::error::cask requires build-command and asset"; exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Pick the next version
        id: version
        run: |
          latest="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
          major="${major#v}"
          if [[ "$(git log -1 --format=%s)" == feat* ]]; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          CASK: ${{ inputs.cask }}
        run: |
          flags=()
          [[ -z "$CASK" ]] || flags+=(--draft)
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes "${flags[@]}"

  asset:
    if: inputs.cask != ''
    needs: release
    runs-on: macos-26
    permissions:
      contents: write
      id-token: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app
      OP_WORKLOAD_ID: ${{ vars.OP_WORKLOAD_ID }}
      OP_ENVIRONMENT_ID: ${{ vars.OP_ENVIRONMENT_ID }}
      OP_INTEGRATION_KEY: ${{ secrets.OP_INTEGRATION_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: 1password/load-secrets-action@v5
        with:
          export-env: true
      - name: Import the signing certificate
        run: |
          [[ -n "${DEVELOPER_ID_P12:-}" ]] || exit 0
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 32)"
          echo "::add-mask::$password"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          keychains=()
          while IFS= read -r existing; do keychains+=("$existing"); done < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
          security list-keychains -d user -s "$keychain" "${keychains[@]}"
          security default-keychain -s "$keychain"
          base64 --decode <<< "$DEVELOPER_ID_P12" > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          if [[ -z "$identity" ]]; then
            echo "::error::No Developer ID Application identity in DEVELOPER_ID_P12"; exit 1
          fi
          echo "::add-mask::$identity"
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Stage the notarisation key
        run: |
          [[ -n "${NOTARY_KEY:-}" ]] || exit 0
          base64 --decode <<< "$NOTARY_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build the asset
        env:
          TAG: ${{ needs.release.outputs.tag }}
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          export VERSION="${TAG#v}"
          bash -euo pipefail -c "$BUILD_COMMAND"
      - name: Upload the asset to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          ASSET: ${{ inputs.asset }}
        run: gh release upload "$TAG" "$ASSET"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
      - name: Remove the signing material
        if: always()
        run: |
          [[ -z "${SIGNING_KEYCHAIN:-}" ]] || security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm "$RUNNER_TEMP/AuthKey.p8" 2>/dev/null || true

  homebrew:
    if: always() && needs.release.result == 'success' && needs.asset.result != 'failure' && needs.asset.result != 'cancelled' && (inputs.formula != '' || inputs.cask != '')
    needs: [release, asset]
    permissions:
      contents: read
      id-token: write
    uses: willsawyerrrr/platform/.github/workflows/homebrew.yml@main
    with:
      tag: ${{ needs.release.outputs.tag }}
      formula: ${{ inputs.formula }}
      cask: ${{ inputs.cask }}
      asset: ${{ inputs.asset }}
    secrets: inherit
