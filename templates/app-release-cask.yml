name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write

jobs:
  release:
    uses: willsawyerrrr/platform/.github/workflows/release.yml@main
    with:
      cask: @NAME@
      asset: @APP@.zip
      build-command: |
        scripts/package-app.sh "$VERSION"
    secrets: inherit
